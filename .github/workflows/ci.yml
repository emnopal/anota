name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + commit count (build number)
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/make-app.sh
      - name: Package
        run: |
          TAG=$(scripts/release-tag.sh)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ditto -c -k --keepParent build/Anota.app "Anota-$TAG-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Anota-${{ env.TAG }}
          path: Anota-${{ env.TAG }}-macos.zip
          if-no-files-found: error

  release:
    # Only after tests and build passed, and only for pushes to main.
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls dist/*.zip)
          TAG=$(basename "$ZIP" | sed -E 's/^Anota-(.*)-macos\.zip$/\1/')
          scripts/release-notes.sh > notes.md
          case "$TAG" in
            *-rc-*) PRE=--prerelease; printf '\nPre-release build of %s from %s.\n' "$(cat .version)" "$GITHUB_SHA" >> notes.md ;;
            *) PRE= ;;
          esac
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Anota $TAG" --notes-file notes.md $PRE
