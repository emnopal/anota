name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + commit count (build number)
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/make-app.sh
      - name: Package
        # GitHub release assets must be files, so the .app ships inside a disk image (open it, drag Anota.app out).
        run: |
          TAG=$(scripts/release-tag.sh)
          ARCH=$(lipo -archs build/Anota.app/Contents/MacOS/Anota | tr ' ' '+')
          NAME="Anota-$TAG-macos-$ARCH"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "$TAG" > dist-tag.txt
          mkdir -p dmg && cp -R build/Anota.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Anota $TAG" -srcfolder dmg -fs HFS+ -format UDZO "$NAME.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.dmg
            dist-tag.txt
          if-no-files-found: error

  release:
    # Only after tests and build passed, and only for pushes to main.
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls dist/*.dmg)
          TAG=$(cat dist/dist-tag.txt)
          ARCH=$(basename "$DMG" .dmg | sed 's/.*-macos-//')
          scripts/release-notes.sh > notes.md
          printf '\n**Download:** `%s` (%s, macOS 26+). Open the disk image and drag Anota.app to Applications.\n' "$(basename "$DMG")" "$ARCH" >> notes.md
          case "$TAG" in
            *-rc-*) PRE=--prerelease; printf '\nPre-release build of %s from %s.\n' "$(cat .version)" "$GITHUB_SHA" >> notes.md ;;
            *) PRE= ;;
          esac
          gh release create "$TAG" "$DMG" --target "$GITHUB_SHA" --title "Anota $TAG" --notes-file notes.md $PRE
